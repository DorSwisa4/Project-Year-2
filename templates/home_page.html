<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyHigh - Find Your Freedom</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar">
        <div class="nav-content">
            <h2 style="color:white; font-weight:800;">Fly-Tau</h2>

            <div class="nav-links">

                {% if 'user_name' in session %}
                    <span style="color: #00a8e8; margin-left: 20px; font-weight: bold;">
                        Hello, {{ session['user_name'] }}
                    </span>
                    <a href="{{ url_for('logout') }}" style="color: #ff4d4d;">Logout</a>

                {% else %}
                    <a href="{{ url_for('signup') }}">Sign up</a>
                    <a href="{{ url_for('login') }}">Login</a>
                    <a href="#">Manager Login</a>
                {% endif %}
                </div>
        </div>
    </nav>

    <div class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">Millions of cheap flights. One simple search.</h1>

            <form action="/search" method="POST" class="search-widget">

                <div class="search-row-top">
                    <input type="text" name="flight_num" placeholder="Flight Number (Optional)" class="transparent-input">
                </div>

                <div class="search-row-main">
                    <div class="input-card location-card">
                        <label>From</label>
                        <div class="multi-input-group">
                            <input type="text" name="source_country" placeholder="Country" required>
                            <input type="text" name="source_city" placeholder="City" required>
                            <input type="text" name="source_airport" placeholder="Airport" required>
                        </div>
                    </div>

                    <div class="swap-icon">
                        <i class="fas fa-exchange-alt"></i>
                    </div>

                    <div class="input-card location-card">
                        <label>To</label>
                        <div class="multi-input-group">
                            <input type="text" name="dest_country" placeholder="Country" required>
                            <input type="text" name="dest_city" placeholder="City" required>
                            <input type="text" name="dest_airport" placeholder="Airport" required>
                        </div>
                    </div>

                    <div class="input-card date-card">
                        <div class="date-group">
                            <label>Depart</label>
                            <input type="date" name="exit_date" required>
                        </div>
                        <div class="date-group border-left">
                            <label>Return</label>
                            <input type="date" name="return_date">
                        </div>
                    </div>

                    <button type="submit" class="search-btn">
                        Search
                    </button>
                </div>

                <div class="search-options">
                    <label><input type="checkbox"> Add nearby airports</label>
                    <label><input type="checkbox"> Direct flights only</label>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
