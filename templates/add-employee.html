<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly-Tau - Add Employee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-content">
            <a href="{{ url_for('manager_dashboard') }}" style="text-decoration: none; display: flex; align-items: center;">

                <img src="{{ url_for('static', filename='logo.png') }}"
                     alt="Logo"
                     style="height: 75px; width: auto; margin-right: 10px;">

                <h2 style="color:white; font-weight:800; margin: 0;">Fly-Tau<span style="font-weight:300; font-size: 0.8em; opacity: 0.8;">| Management</span></h2>
            </a>
        </div>
        <div class="nav-links">
            <span style="color: #00a8e8; margin-right: 20px; font-weight: bold;">
                <i class="fas fa-user-tie"></i> {{ session['user_name'] }}
            </span>
            <a href="{{ url_for('manager_dashboard') }}">More Operations</a>
            <a href="{{ url_for('logout') }}" style="color: #ff4d4d;"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </nav>

    <div class="auth-wrapper bg-add-employee">

        <div class="registration-container" style="max-width: 600px; width: 100%;">

            {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div style="background-color: #e3f2fd; border-left: 5px solid #2196F3; padding: 15px; margin-bottom: 20px; border-radius: 5px;">
                    {% for message in messages %}
                    <p style="margin: 0; color: #333;">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
            {% endwith %}

            <h2 style="color: #02122c; text-align: center; margin-bottom: 25px;">
                <i class="fas fa-user-plus"></i> Add New Employee
            </h2>

            <form action="{{ url_for('add_employee') }}" method="POST">

                <div class="form-group">
                    <label>Employee Role <span style="color:red">*</span></label>
                    <select name="role" id="role-selector" class="modern-input" required>
                        <option value="" disabled selected>Select Role...</option>
                        <option value="Manager">Manager</option>
                        <option value="Pilot">Pilot</option>
                        <option value="Attendant">Attendant</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ID Number <span style="color:red">*</span></label>
                    <input type="text" name="id_num" class="modern-input" placeholder="e.g. 123456789" required>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>First Name</label>
                        <input type="text" name="first_name" class="modern-input" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Last Name</label>
                        <input type="text" name="last_name" class="modern-input" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" name="phone" class="modern-input" required>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 2;">
                        <label>City</label>
                        <input type="text" name="city" class="modern-input" required>
                    </div>
                    <div class="form-group" style="flex: 2;">
                        <label>Street</label>
                        <input type="text" name="street" class="modern-input" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>No.</label>
                        <input type="number" name="house_number" class="modern-input" required>
                    </div>
                </div>

                <div id="manager-fields" style="display: none; background: #f0f8ff; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px dashed #00a8e8;">
                    <label style="color: #0277bd;">Manager Password <span style="color:red">*</span></label>
                    <input type="password" name="password" class="modern-input" placeholder="Create a secure password">
                </div>

                <div id="crew-fields" style="display: none; background: #f0f8ff; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px dashed #00a8e8;">
                    <label style="color: #0277bd;">Long Flight Training?</label>
                    <select name="long_flight_training" class="modern-input">
                        <option value="False">No</option>
                        <option value="True">Yes</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn" style="margin-top: 25px;">
                    Register Employee
                </button>

            </form>
        </div>
    </div>

    <script>
        document.getElementById('role-selector').addEventListener('change', function() {
            var role = this.value;
            var managerDiv = document.getElementById('manager-fields');
            var crewDiv = document.getElementById('crew-fields');

            managerDiv.style.display = 'none';
            crewDiv.style.display = 'none';

            if (role === 'Manager') {
                managerDiv.style.display = 'block';
            } else if (role === 'Pilot' || role === 'Attendant') {
                crewDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
