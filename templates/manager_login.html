<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly-Tau Manager Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-content">
            <a href="{{ url_for('home') }}" style="text-decoration: none;">
                <h2 style="color:white; font-weight:800;">Fly-Tau</h2>
            </a>

            <div class="nav-links">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('signup') }}">Sign up</a>
                <a href="{{ url_for('login') }}">Login</a>
            </div>
        </div>
    </nav>

    <div class="auth-wrapper bg-manager-login">

        <div class="registration-container" style="max-width: 400px;">

            <div class="form-header">
                <h2>Manager Access</h2>
                <br>
                <p style="color: #02122c; text-align: center; font-weight:500;">Authorized Personnel Only</p>
                <br>
            </div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="flash-messages" style="background: #ffebee; color: #c62828; padding: 10px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-size: 0.9rem;">
                        {% for message in messages %}
                            <p style="margin: 0;">{{ message }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="/manager_login" method="POST">

                <div class="form-group">
                    <label for="id_num">ID Number</label>
                    <input type="text" id="id_num" name="id_num" class="modern-input" required placeholder="Enter Employee ID">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" class="modern-input" required>
                        <i class="fa-solid fa-eye toggle-icon" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Login to Dashboard</button>

            </form>
        </div>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        if (togglePassword) {
            togglePassword.addEventListener('click', function (e) {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);

                // Toggle the eye / eye-slash icon class
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
        }
    </script>
</body>
</html>
