<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkyHigh - Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* OVERRIDE BACKGROUND IMAGE SPECIFICALLY FOR THIS PAGE */
        body {
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://media.istockphoto.com/id/1409409162/photo/cropped-image-of-passenger-receiving-boarding-pass.jpg?s=2048x2048&w=is&k=20&c=9_s2BDGHQZ4RNKxMEvcacbmPr5Uy7yIxwQFxHwiw3aI=') no-repeat center center fixed !important;
            background-size: cover !important;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-content">
            <h2 style="color:white; font-weight:800; letter-spacing: 1px;">SkyHigh</h2>
            <div class="nav-links">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="#">Login</a>
            </div>
        </div>
    </nav>

    <div class="hero-section">

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div style="position: absolute; top: 80px; width: 100%; max-width: 450px; z-index: 10;">
                    <div class="flash-messages">
                        {% for message in messages %}
                            <p>{{ message }}</p>
                        {% endfor %}
                    </div>
                </div>
            {% endif %}
        {% endwith %}

        <div class="registration-container">
            <div class="form-header">
                <h2>Create Account</h2>
                <p style="color: #666; font-size: 0.9rem;">Join us and start flying.</p>
            </div>

            <form action="/signup" method="POST">

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="modern-input" placeholder="e.g. john@example.com" required>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>First Name (English)</label>
                        <input type="text" name="first_name" class="modern-input" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Last Name (English)</label>
                        <input type="text" name="last_name" class="modern-input" required>
                    </div>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Passport Number</label>
                        <input type="text" name="passport_num" class="modern-input" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Date of Birth</label>
                        <input type="date" name="birth_date" class="modern-input" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="modern-input" placeholder="Choose a strong password" required>
                </div>

                <div class="form-group">
                    <label>Phone Numbers</label>
                    <div id="phone-container">
                        <input type="text" name="phones" class="modern-input" placeholder="Primary Phone Number" required style="margin-bottom: 10px;">
                    </div>

                    <button type="button" class="add-phone-btn" onclick="addPhone()">
                        + Add Another Phone
                    </button>
                </div>

                <button type="submit" class="signup-btn" style="width: 100%; margin-top: 10px;">Register Now</button>
            </form>
        </div>
    </div>

    <script>
        function addPhone() {
            var container = document.getElementById("phone-container");

            // Create new input
            var input = document.createElement("input");
            input.type = "text";
            input.name = "phones";
            input.placeholder = "Additional Phone";

            // Add the same style class to the new input so it looks good
            input.className = "modern-input";
            input.style.marginBottom = "10px"; // Add some spacing

            // Append to container
            container.appendChild(input);
        }
    </script>

</body>
</html>
