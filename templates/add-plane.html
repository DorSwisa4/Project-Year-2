<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly-Tau - Add Plane</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        #business-section {
            transition: all 0.3s ease-in-out;
        }
        .section-title {
            color: #00a8e8;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
            margin-top: 20px;
            margin-bottom: 15px;
        }
        .row-col-wrapper {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-content">
            <a href="{{ url_for('manager_dashboard') }}" style="text-decoration: none;">
                <h2 style="color:white; font-weight:800;">Fly-Tau<span style="font-weight:300; font-size: 0.8em; opacity: 0.8;">| Management</span></h2>
            </a>
        </div>
        <div class="nav-links">
            <span style="color: #00a8e8; margin-right: 20px; font-weight: bold;">
                <i class="fas fa-user-tie"></i> {{ session['user_name'] }}
            </span>
            <a href="{{ url_for('manager_dashboard') }}">More Operations</a>
            <a href="{{ url_for('logout') }}" style="color: #ff4d4d;"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </nav>

    <div class="auth-wrapper bg-add-plane">
        <div class="registration-container" style="max-width: 600px; width: 100%;">

            {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div style="background-color: #e3f2fd; border-left: 5px solid #2196F3; padding: 15px; margin-bottom: 20px; border-radius: 5px;">
                    {% for message in messages %}
                    <p style="margin: 0; color: #333;">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
            {% endwith %}

            <h2 style="color: #02122c; text-align: center; margin-bottom: 25px;">
                <i class="fas fa-plane"></i> Add A New Plane
            </h2>

            <form action="{{ url_for('add_plane') }}" method="POST">

                <div class="form-group">
                    <label>Manufacturer:</label>
                    <select name="manufacturer" required style="width: 100%; padding: 10px;">
                        <option value="" disabled selected>Select Manufacturer...</option>
                        <option value="Airbus">Airbus</option>
                        <option value="Boeing">Boeing</option>
                        <option value="Dassault">Dassault</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Purchase Date:</label>
                    <input type="date" name="purchase_date" required style="display:block; width: 95%; padding: 10px;">
                </div>

                <div class="form-group">
                    <label>Plane Size:</label>
                    <select name="size" id="size-selector" required style="width: 100%; padding: 10px;" onchange="toggleBusinessSection()">
                        <option value="" disabled selected>Select Size...</option>
                        <option value="Small">Small (Economy Only)</option>
                        <option value="Big">Big (Economy + Business)</option>
                    </select>
                </div>

                <h4 class="section-title"><i class="fas fa-chair"></i> Economy Class Config</h4>
                <div class="row-col-wrapper">
                    <div style="width: 48%;">
                        <label>Rows:</label>
                        <input type="number" name="eco_rows" value="20" min="1" required style="width: 90%; padding: 8px;">
                    </div>
                    <div style="width: 48%;">
                        <label>Columns:</label>
                        <input type="number" name="eco_cols" value="6" min="1" max="10" required style="width: 90%; padding: 8px;">
                    </div>
                </div>

                <div id="business-section" style="display: none;">
                    <h4 class="section-title"><i class="fas fa-glass-cheers"></i> Business Class Config</h4>
                    <div class="row-col-wrapper">
                        <div style="width: 48%;">
                            <label>Rows:</label>
                            <input type="number" id="bus-rows" name="bus_rows" min="1" style="width: 90%; padding: 8px;">
                        </div>
                        <div style="width: 48%;">
                            <label>Columns:</label>
                            <input type="number" id="bus-cols" name="bus_cols" min="1" max="10" style="width: 90%; padding: 8px;">
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn" style="margin-top: 25px;">
                    Add Plane
                </button>

            </form>
        </div>
    </div>

    <script>
        function toggleBusinessSection() {
            const sizeSelector = document.getElementById('size-selector');
            const businessSection = document.getElementById('business-section');
            const busRows = document.getElementById('bus-rows');
            const busCols = document.getElementById('bus-cols');

            if (sizeSelector.value === 'Big') {
                // Show section
                businessSection.style.display = 'block';

                // Make inputs required (so user doesn't submit empty values for a Big plane)
                busRows.setAttribute('required', 'required');
                busCols.setAttribute('required', 'required');
            } else {
                // Hide section
                businessSection.style.display = 'none';

                // Remove required (so form can submit without them)
                busRows.removeAttribute('required');
                busCols.removeAttribute('required');

                // Optional: clear values
                busRows.value = '';
                busCols.value = '';
            }
        }
    </script>

</body>
</html>
