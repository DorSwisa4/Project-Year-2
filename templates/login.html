<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkyHigh - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-content">
            <h2 style="color:white; font-weight:800;">SkyHigh</h2>
            <div class="nav-links">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('signup') }}">Sign Up</a>
            </div>
        </div>
    </nav>

    <div class="hero-section">

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div style="position: absolute; top: 90px; width: 100%; max-width: 450px; z-index: 10;">
                    <div class="flash-messages">
                        {% for message in messages %}
                            <p>{{ message }}</p>
                        {% endfor %}
                    </div>
                </div>
            {% endif %}
        {% endwith %}

        <div class="registration-container">
            <div class="form-header">
                <h2>Welcome Back</h2>
                <p style="color: #666;">Please enter your details to login.</p>
            </div>

            <form action="/login" method="POST">

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="modern-input" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="modern-input" required>
                </div>

                <button type="submit" class="signup-btn" style="width: 100%; margin-top: 10px;">Login</button>
                <a href="{{ url_for('signup') }}" Not a user? Sign-Up here!></a>
            </form>
        </div>
    </div>
</body>
</html>
